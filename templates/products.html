{% extends "base.html" %}{% block content %}<h1>ကုန်ပစ္စည်းစီမံခန့်ခွဲမှု</h1><section class="card"><h2>ပစ္စည်းအသစ်ထည့်ရန်</h2><form method="post" class="formgrid"><input name="name" placeholder="ပစ္စည်းအမည်" required><input name="barcode" placeholder="Barcode"><input name="category" placeholder="အမျိုးအစား"><input name="cost" type="number" min="0" step="0.01" placeholder="အရင်းဈေး" required><input name="price" type="number" min="0" step="0.01" placeholder="အရောင်းဈေး" required><input name="stock" type="number" min="0" step="0.01" placeholder="လက်ကျန်" required><input name="unit" placeholder="ယူနစ် (ခု/ထုပ်/ပိဿာ)" value="ခု"><button>သိမ်းဆည်းမည်</button></form></section><section class="card"><h2>ကုန်ပစ္စည်းစာရင်း</h2><div class="tablewrap"><table><tr><th>အမည်</th><th>Barcode</th><th>အရင်း</th><th>အရောင်း</th><th>လက်ကျန်</th><th></th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.barcode or '-'}}</td><td>{{p.cost|mm}}</td><td>{{p.price|mm}}</td><td>{{p.stock}} {{p.unit}}</td><td><form method="post" action="/products/{{p.id}}/delete" onsubmit="return confirm('ဖျက်မလား?')"><button class="danger">ဖျက်</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
