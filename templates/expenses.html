{% extends "base.html" %}{% block content %}<h1>အသုံးစရိတ်</h1><section class="card"><form method="post" class="formgrid"><input name="title" placeholder="အသုံးစရိတ်အမည်" required><input name="amount" type="number" min="0.01" step="0.01" placeholder="ငွေပမာဏ" required><select name="currency"><option value="MMK">MMK ကျပ်</option><option value="KRW">KRW ဝမ်</option></select><input name="note" placeholder="မှတ်ချက်"><button>သိမ်းဆည်းမည်</button></form></section><section class="card"><table><tr><th>အမည်</th><th>ငွေပမာဏ</th><th>ငွေကြေး</th><th>မှတ်ချက်</th><th>နေ့စွဲ</th></tr>{% for e in expenses %}<tr><td>{{e.title}}</td><td>{{e.amount|money(e.currency)}}</td><td>{{e.currency}}</td><td>{{e.note}}</td><td>{{e.created_at}}</td></tr>{% endfor %}</table></section>{% endblock %}
